# Runs the same checks as `python tests/run_all.py` (no API key needed) on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tests/run_all.py
        env:
          PYTHONIOENCODING: utf-8
